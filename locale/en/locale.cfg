[entity-description]
aircraft=A flying vehicle that can take off, fly over obstacles, and land. Vulnerable to anti-aircraft fire.
small-aa-worm-turret=A hostile worm that shoots down aircraft with homing rockets. Found near enemy bases.
medium-aa-worm-turret=A more dangerous anti-aircraft worm with longer range and more health.
big-aa-worm-turret=The most dangerous anti-aircraft worm with extreme range and durability.

